name: Daily shortlist

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 SA time
  workflow_dispatch:       # "Run workflow" button for a manual run
    inputs:
      run_date:
        description: "Date to check (YYYY-MM-DD). Leave blank for today."
        required: false
      mode:
        description: "daily = normal shortlist, backtest = test the rules on past matches"
        required: false
        default: daily
      backtest_days:
        description: "Backtest: how many past days"
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: daily-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest results (a queued run may have started from an older commit)
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the rules
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
          BACKTEST_DAYS: ${{ github.event.inputs.backtest_days }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then python backtest.py; else python run.py; fi
      - name: Save results and publish page
        run: |
          git config user.name "shortlist-bot"
          git config user.email "shortlist-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Shortlist $(date -u +%F)"
          git pull --rebase --autostash
          git push
